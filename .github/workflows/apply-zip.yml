name: Aplicar lote (zip)

on:
  push:
    branches: [main]
    paths: ["*.zip"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir lotes
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile, posixpath

          ALLOWED_DIRS = ("src/", "supabase/", "public/", "docs/", "tests/", "scripts/")
          ALLOWED_ROOT = {
              "next.config.ts", "package.json", "tsconfig.json", "eslint.config.mjs",
              "postcss.config.mjs", ".env.example", ".gitignore", "README.md",
              "SECURITY.md", "vitest.config.ts", "playwright.config.ts",
          }
          MAX_FILE = 6 * 1024 * 1024

          zips = sorted(glob.glob("*.zip"))
          if not zips:
              print("No hay archivos .zip.")
              sys.exit(0)

          plan = []
          for zpath in zips:
              with zipfile.ZipFile(zpath) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      name = info.filename
                      if "\\" in name or name.startswith("/") or ".." in name.split("/"):
                          sys.exit(f"RECHAZADO ({zpath}): ruta no válida: {name}")
                      name = posixpath.normpath(name)
                      if name.startswith(".github") or name.startswith(".git/"):
                          sys.exit(f"RECHAZADO ({zpath}): carpeta no permitida: {name}")
                      if not (name.startswith(ALLOWED_DIRS) or name in ALLOWED_ROOT):
                          sys.exit(f"RECHAZADO ({zpath}): ruta fuera de las permitidas: {name}")
                      if (info.external_attr >> 16) & 0o170000 == 0o120000:
                          sys.exit(f"RECHAZADO ({zpath}): enlace simbólico: {name}")
                      if info.file_size > MAX_FILE:
                          sys.exit(f"RECHAZADO ({zpath}): archivo demasiado grande: {name}")
                      plan.append((zpath, info, name))

          for zpath in zips:
              with zipfile.ZipFile(zpath) as z:
                  for p_zip, info, name in plan:
                      if p_zip != zpath:
                          continue
                      os.makedirs(os.path.dirname(name) or ".", exist_ok=True)
                      with z.open(info) as src, open(name, "wb") as dst:
                          dst.write(src.read())
                      print("OK", name)
              os.remove(zpath)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "benzinasaid78-del"
          git config user.email "benzinasaid78-del@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Aplicar lote subido (zip)"
            git push
          fi
